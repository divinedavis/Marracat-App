# marracat.com's own access log, with the host so its lines can never be
# confused with another vhost's. $uri, not $request: no query strings (OAuth
# codes, search terms) are written down. Read by metrics/marracat_metrics.py.
log_format marracat_site '$host $remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name marracat.com www.marracat.com;
    root /var/www/marracat;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://marracat.com$request_uri; }
}

# HTTP/2 (2026-11-10): the site answered HTTP/1.1 only, so a first visit opened up
# to six connections and queued its script, styles, fonts and API calls on
# them. "listen ... http2" turns it on per address, so caprecruiting.com on
# this droplet gets it too (the directive is deprecated since nginx 1.25 but
# kept for that reason).
#
# HTTP/3 (owner, 2026-11-11: "turn it on"): QUIC over UDP 443, from nginx.org's
# own packages (Ubuntu's 1.24 has no http_v3; 1.30 from nginx.org since
# 2026-11-11, ufw allows 443/udp). Browsers find it through Alt-Svc on the
# page and switch for the next requests; anything that can't do QUIC stays on
# HTTP/2. reuseport may appear once per address, so it is on marracat.com's
# block only.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 443 quic;
    listen [::]:443 quic;
    server_name www.marracat.com;
    add_header Strict-Transport-Security "max-age=31536000" always;
    ssl_certificate /etc/letsencrypt/live/marracat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marracat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://marracat.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    server_name marracat.com;
    root /var/www/marracat;
    access_log /var/log/nginx/marracat.access.log marracat_site;
    index index.html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    ssl_certificate /etc/letsencrypt/live/marracat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marracat.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.apple-mapkit.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self' https://*.apple-mapkit.com https://*.ls.apple.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://appleid.apple.com https://*.bigcartel.com" always;

    # The catalogs are served from the droplet, not proxied from GitHub: at
    # every product a brand sells, catalog-v3.json is 107 MB and GitHub refuses
    # a file over 100 MB. gzip takes it to 13 MB on the wire. Older builds ask
    # for the paths they have always asked for, and get the same files.
    location ~ ^/catalog(-v[23])?\.json(\.sig)?$ {
        root /var/www/marracat-catalog;
        gzip_static on;
        add_header Cache-Control "public, max-age=900";
        add_header Access-Control-Allow-Origin "*";
        # add_header here replaces the server's set, so the security headers
        # are repeated (2026-11-12: these files went out without them).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # Catalog deltas (catalog/catalog_delta.py, 2026-10-18): what changed in
    # catalog-v3.json since each recent version, signed like the catalog, the
    # manifests they're made from, and manifests.txt listing those versions.
    # Put live by refresh-server/receiver/marracat-catalog-deltas.
    # Quoted: nginx reads an unquoted { as the block's start.
    location ~ "^/catalog-v3/(delta-[0-9a-f]{16}\.json(\.sig)?|manifest-[0-9a-f]{16}\.json\.gz|manifests\.txt)$" {
        root /var/www/marracat-catalog;
        gzip_static on;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        # add_header here replaces the server's set, so the security headers
        # are repeated (2026-11-12: these files went out without them).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # The app's on-device AI files (Marracat/ML/MeaningIndex.swift): the
    # product meaning vectors and the MobileCLIP text model, published by
    # scripts/publish_ml.sh. Versioned names; the vectors change with the
    # catalog, so they revalidate by ETag like the catalogs.
    location ~ ^/ml/(product-vectors-v[0-9]+\.bin|mobileclip-text-v[0-9]+\.aar)$ {
        root /var/www/marracat-catalog;
        add_header Cache-Control "public, max-age=900";
        # add_header here replaces the server's set, so the security headers
        # are repeated (2026-11-12: these files went out without them).
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # Lets a shared product link, marracat.com/p/<id>, and the website's QR
    # code, marracat.com/app, open in the app when it's installed. An exact match, so it wins over the dotfile rule below.
    # No add_header here: one in a location drops the server's security headers.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        return 200 '{"applinks":{"details":[{"appIDs":["CG89RY4W6R.com.divinedavis.marracat"],"components":[{"/":"/p/*","comment":"A shared product"},{"/":"/app","comment":"The website QR code"}]}]}}';
    }
    # Marracat's UCP agent profile (see web/server/ucp-profile.json). Exact
    # match, so it wins over the dotfile rule below.
    location = /.well-known/ucp {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ /\. { deny all; }
    location ~ ^/(auth/|api/|signin$) {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # A shared product link gets that product's preview card (photo, name,
    # brand) from the server; the page itself is the same website.
    # The website QR code and the link to share the app (server/index.js): an
    # installed app opens it as a universal link; otherwise the server's page
    # gives link previews our iPhone screenshot, then forwards to the App Store.
    # Google Search Console ownership (same token as every site the
    # search-console-reader service account verifies; see memory notes).
    location = /googlef630845c68076fd4.html {
        default_type text/html;
        return 200 "google-site-verification: googlef630845c68076fd4.html";
    }
    location = /app {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @appstore;
    }
    location @appstore { return 302 https://apps.apple.com/us/app/marracat/id6810905687; }
    location ^~ /p/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    # Big Cartel checkout hand-off (server/bigcartel.js).
    location ^~ /go/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    # Shared brand links: Open Graph preview (server/share-page.js).
    location ^~ /b/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    # Department pages with their own title, description and structured data (server/share-page.js).
    location ^~ /c/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = /index.html;
    }
    # robots.txt and the sitemap come from the server (server/seo.js), built from the catalog.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # The sitemap index.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # The sitemap files.
    location ^~ /sitemaps/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host marracat.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    # The service worker must never be an old copy: a browser holding a stale
    # one keeps serving what it cached. "expires" rather than add_header, which
    # in a location would drop the server's security headers.
    location = /sw.js { try_files $uri =404; expires -1; }
    # deploy.sh ships each script and stylesheet with its .gz beside it.
    location /assets/ { try_files $uri =404; gzip_static on; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
