# Bootstrap HTTP so Let's Encrypt can validate before TLS is configured.
server {
    listen 80;
    listen [::]:80;
    server_name marracat.com www.marracat.com;
    root /var/www/marracat;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
